[platformio]
default_envs = esp32dev

; Generic ESP32 target already used successfully for this robot's uploads.
; esp32dev selects A; esp32dev_b selects B (inherits A's unvalidated profile).
[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
; Preserve the ESP32 HAL's raw error name (e.g. ESP_ERR_INVALID_RESPONSE)
; before Wire compresses it to result 4. Error logging only, no motion retries.
build_unflags = -DCORE_DEBUG_LEVEL=0
build_flags = -DCORE_DEBUG_LEVEL=1 -DSWRM_ENABLE_LED_PANEL=1
upload_speed = 115200
monitor_speed = 115200
monitor_filters = direct
monitor_echo = yes
monitor_dtr = 0
monitor_rts = 0

; Dependencies for the LED board
lib_deps = 
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.14
	adafruit/Adafruit GFX Library@^1.12.3

[env:esp32dev_b]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSWRM_ROBOT_ID=2

; Lead's WiFiClient/PubSubClient connection, isolated from the movement loop.
; PubSubClient v2.8 is local in lib/ with one retained-bit accessor (see SWRM_PATCH.md).
[env:esp32dev_mqtt]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSWRM_ENABLE_MQTT=1

[env:esp32dev_b_mqtt]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DSWRM_ROBOT_ID=2 -DSWRM_ENABLE_MQTT=1

