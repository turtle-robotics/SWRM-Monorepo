; Separate communication-only firmware. Upload this folder explicitly when
; diagnosing the driver link, then upload the parent project to restore controls.
[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_filters = direct
monitor_echo = yes
monitor_dtr = 0
monitor_rts = 0

