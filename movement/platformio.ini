[env:esp32dev]
; Generic ESP-WROOM-32 development board from your parts list.
; Platform version matches the installed ESP32 toolchain used to check this project.
platform = espressif32@8.0.0
board = esp32dev
; Arduino supplies setup(), loop(), Serial and Wire; you still write normal C++.
framework = arduino
; Must match Serial.begin() in robot_config.h.
monitor_speed = 115200
; Buffer what you type until Enter and display your input in the terminal.
monitor_filters = send_on_enter
monitor_echo = yes
; Conservative initial USB upload rate. This is not a motor speed setting.
upload_speed = 115200

